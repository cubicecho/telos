name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Codegen imports @telos/db, which refuses to load without one. Nothing here
# connects — postgres-js is lazy, and the tests build their own in-memory
# database.
env:
  DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci

# Lint, typecheck and each test project are separate jobs, so they run side by
# side rather than one after another, and each gets a runner's cores to itself.
jobs:
  # Formatting, lint and import order in one pass. `ci` differs from
  # `npm run check:biome` only in never writing fixes. Biome skips
  # `__generated__`, so this needs no codegen.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx biome ci .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run codegen
      - run: npm run check:types

  # The two Vitest projects: server and db tests run Postgres in-process
  # (PGlite) and the component tests run in jsdom, so there is no service
  # container here and there doesn't need to be one.
  test:
    runs-on: ubuntu-latest
    strategy:
      # One project failing says nothing about the other's answer.
      fail-fast: false
      matrix:
        project: [node, dom]
    name: test (${{ matrix.project }})
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run codegen
      - run: npx vitest run --project ${{ matrix.project }}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Built but not pushed. The release workflow publishes this same
      # Dockerfile on every version bump, and the README's Quickstart tells
      # self-hosters to pull what it produces — so a Dockerfile that no longer
      # builds should fail on the pull request that broke it, not on the push
      # to main that was meant to ship it.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
