# Just the database, for running the app from source. `npm run db:up`.
#
# Its own project name, so it never collides with the containers
# docker-compose.yml creates — both files define a service called `postgres`.
name: telos-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: telos
      POSTGRES_PASSWORD: telos
      POSTGRES_DB: telos
    ports:
      # Loopback by default: an unencrypted Postgres with a throwaway password
      # has no business on a network. Override POSTGRES_BIND to 0.0.0.0 when the
      # Docker daemon is not this machine (`docker context ls` shows a remote
      # endpoint) — the loopback it binds is the daemon host's, not yours.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - telos_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telos -d telos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  telos_dev_pgdata:
