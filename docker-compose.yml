# The deployment: the app and its database. `docker compose up --build`.
name: telos

services:
  telos:
    image: vantreeseba/telos:latest
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Required — generate with: openssl rand -hex 32
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required — generate one with `openssl rand -hex 32`}
      DATABASE_URL: postgres://telos:${POSTGRES_PASSWORD:-telos}@postgres:5432/telos
      APP_URL: ${APP_URL:-http://localhost:3001}
      # At least one way to sign in: SMTP_URL to email links, an OIDC provider
      # (paired from the login page, or OIDC_ISSUER), or SECURE_LOCAL_NET on a
      # private network. See "Signing in" in the README.
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SECURE_LOCAL_NET: ${SECURE_LOCAL_NET:-false}
      # Reverse proxies in front of this server: 1 behind one. Sign-in is
      # throttled per client address, which is only right when this is.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # false removes AI entirely; otherwise an admin switches it on in Settings.
      # See "AI" in the README.
      AI_ENABLED: ${AI_ENABLED:-}
      # The runner comes with the server and needs no key; these only tune it.
      RUNNER_CONCURRENCY: ${RUNNER_CONCURRENCY:-2}
      RUNNER_POLL_SECONDS: ${RUNNER_POLL_SECONDS:-5}
      # Lets check lanes run shell commands here. Leave off unless every user
      # with AI on is someone you would hand a shell.
      RUNNER_ALLOW_CHECKS: ${RUNNER_ALLOW_CHECKS:-false}
      NODE_ENV: production
      PORT: 3001
    ports:
      - "${PORT:-3001}:3001"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: telos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telos}
      POSTGRES_DB: telos
    # Bound to loopback: the database is for the app next to it, not the network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - telos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telos -d telos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  telos_pgdata:
