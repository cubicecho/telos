<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="color-scheme" content="light dark" />
    <title>%WEB_TITLE%</title>
    <!--
      Expo's default template, plus the theme applied before first paint.

      This file exists only for that script. `app/+html.tsx` is the documented
      place for it, but Expo only renders that under static output; with
      `web.output: "single"` the shell comes from `public/index.html` when the
      project has one, and from Expo's own copy otherwise. Keep the rest in step
      with node_modules/@expo/cli/static/template/index.html.

      The script is cubeui's THEME_PRE_PAINT_SCRIPT (ui/theme-preference-base.ts),
      pasted because none of the bundle has loaded yet; re-paste it when that
      item changes. The line before it moves a preference saved under telos's
      old key, `telos_theme`, to cubeui's.
    -->
    <script>
      (function(){try{var o=localStorage.getItem("telos_theme");if(o!==null){if(localStorage.getItem("cubeui-theme")===null)localStorage.setItem("cubeui-theme",o);localStorage.removeItem("telos_theme")}}catch(e){}})();
      (function(){try{var p=localStorage.getItem("cubeui-theme");var d=p==="dark"||(p!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);var c=document.documentElement.classList;c.toggle("dark",d);c.toggle("light",p==="light")}catch(e){}})();
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
